name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          KOMA_DATA_DIR: /tmp/koma-ci

  contracts:
    name: Contracts (Foundry unit + fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # OpenZeppelin and Uniswap v4 come from node_modules (foundry.toml libs = ["../node_modules"]).
      - run: npm ci
      - run: npm --prefix contracts ci --ignore-scripts --no-audit --no-fund
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts

  indexer:
    name: Envio indexer (codegen + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Needs a deployment to generate config.yaml from; skipped until deployments/arc-testnet.json exists.
      - run: |
          if [ -f ../deployments/arc-testnet.json ]; then
            node gen-config.mjs testnet && npx envio codegen && npx tsc --noEmit
          else
            echo "no deployments/arc-testnet.json yet: skipping indexer codegen"
          fi
