name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          KOMA_DATA_DIR: /tmp/koma-ci

  contracts:
    name: Contracts (Foundry unit + fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # OpenZeppelin and Uniswap v4 come from node_modules (foundry.toml libs = ["../node_modules"]).
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts

  fork:
    name: Contracts (Monad testnet fork)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
      # Real AUSD (Agora faucet), Tokenbound, Safe; Uniswap v4 deployed by the deploy script.
      - run: forge test --match-path "test/fork/*" -vv
        working-directory: contracts
        env:
          FORK_TESTS: "1"

  cre:
    name: Chainlink CRE workflow (tests + WASM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cre/koma-canon
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bunx cre-compile main.ts dist/koma-canon.wasm

  indexer:
    name: Envio indexer (codegen + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx envio codegen
      - run: npx tsc --noEmit
