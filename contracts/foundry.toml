[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["../node_modules"]
auto_detect_remappings = false
remappings = [
  "@openzeppelin/=../node_modules/@openzeppelin/",
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v4-core/=../node_modules/@uniswap/v4-core/",
  "@uniswap/v4-periphery/=../node_modules/@uniswap/v4-periphery/",
  "permit2/=../node_modules/@uniswap/v4-periphery/lib/permit2/",
]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 500
# Prebuilt Uniswap v4 artifacts (PoolManager is pinned to solc 0.8.26) are loaded with vm.deployCode in
# unit tests and by the deploy script, which writes deployments/arc-<testnet|mainnet>.json in the repo root.
fs_permissions = [
  { access = "read", path = "../node_modules/@uniswap" },
  { access = "read-write", path = "../deployments" },
  # canonical ERC-6551 / Tokenbound init code, replayed on Arc by the deploy script
  { access = "read", path = "./script/erc6551" },
  { access = "read", path = "test/vectors" },
  # real Tokenbound + Circle USDC runtime code etched by the unit-test fixture
  { access = "read", path = "./test/utils/bytecode" },
]

# Deadlines, the snipe window and canon voting windows are timestamp-based by design.
[lint]
exclude_lints = ["block-timestamp"]
ignore = ["test/**/*.sol", "script/**/*.sol"]

[fuzz]
runs = 512

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc = "https://rpc.mainnet.arc.io"
